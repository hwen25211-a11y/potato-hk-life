<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>土豆子的港硕生活</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff8ec;color:#34556a;font-family:system-ui,sans-serif}body{display:flex;align-items:center;justify-content:center}#frame{position:relative;width:min(100vw,160vh);aspect-ratio:8/5}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff8ec;gap:22px}h1{font-size:42px;margin:0}#track{width:280px;height:10px;background:#e9f2ef;border-radius:20px}#bar{height:100%;width:0;border-radius:20px;background:#6bbf8e}small{font-size:18px;color:#748a8d}#error{max-width:660px;white-space:pre-wrap;padding:20px;color:#bc644e}</style></head><body><div id="frame"><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><small>POTATO, ONE YEAR IN HONG KONG</small><h1>土豆子的港硕生活</h1><span id="status">正在给小屋开窗…</span><div id="track"><div id="bar"></div></div><small>默认 30 秒演示外出 · 没有必须赶上的日程</small><div id="error"></div></div></div><script src="audio-focus.js"></script><script>const loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';loader.onload=()=>createUnityInstance(document.querySelector('#unity-canvas'),{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'{{{ PRODUCT_NAME }}}',productVersion:'{{{ PRODUCT_VERSION }}}'},p=>{document.querySelector('#bar').style.width=p*100+'%';document.querySelector('#status').textContent='正在给小屋开窗… '+Math.round(p*100)+'%'}).then(g=>{window.game=g;window.potatoAudioFocus.attach(g);document.querySelector('#loading').style.display='none'}).catch(e=>document.querySelector('#error').textContent='小屋还没有打开，请刷新重试。\n'+e);document.body.appendChild(loader);</script></body></html>
